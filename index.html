```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>زیست‌یار</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Vazirmatn',sans-serif;
background:linear-gradient(135deg,#0f172a,#0f766e);
}

.page{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:1100px;
padding:25px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1,h2,h3,p{
text-align:center;
color:#111;
}

.hidden{
display:none;
}

input{
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
padding:12px 24px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:#0ea5e9;
color:white;
}

.info{
text-align:center;
font-size:22px;
color:#111;
margin-bottom:20px;
}

.wrap{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.zone{
border:3px dashed #999;
border-radius:15px;
padding:10px;
min-height:220px;
background:#f8fafc;
}

.zone h3{
margin-top:0;
}

.cards{
display:flex;
flex-wrap:wrap;
gap:12px;
justify-content:center;
}

.item{
width:180px;
background:white;
border-radius:15px;
overflow:hidden;
cursor:grab;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.item img{
width:100%;
height:120px;
object-fit:cover;
display:block;
}

.label{
padding:10px;
text-align:center;
font-weight:bold;
color:#111;
}

.correct{
opacity:.8;
}

.badge{
font-size:80px;
text-align:center;
}

@media(max-width:700px){
.wrap{
grid-template-columns:1fr;
}
.item{
width:150px;
}
}

</style>
</head>

<body>

<div id="start" class="page">

<div class="card">

<h1>🎮 زیست‌یار</h1>

<h2>👩‍🏫 دبیر: سرکار خانم معصومه مرتجایی</h2>

<h2>🏫 مدرسه فرزانگان ۱ شهریار</h2>

<p>🧬 روابط بین جانداران را در دسته درست قرار دهید</p>

<div style="text-align:center">

<input id="student" placeholder="نام شرکت‌کننده">

<br><br>

<button onclick="startGame()">شروع بازی</button>

</div>

</div>

</div>

<div id="game" class="page hidden">

<div class="card">

<div class="info">
⭐ <span id="score">0</span> / 8
</div>

<div class="wrap">

<div class="zone" data-type="همیاری">
<h3>🤝 همیاری</h3>
</div>

<div class="zone" data-type="همسفرگی">
<h3>🍽️ همسفرگی</h3>
</div>

<div class="zone" data-type="انگلی">
<h3>🪱 انگلی</h3>
</div>

</div>

<div id="cards" class="cards"></div>

</div>

</div>

<div id="finish" class="page hidden">

<div class="card">

<div id="medal" class="badge">🥉</div>

<h1>گواهی پایان بازی</h1>

<p id="finalText"></p>

</div>

</div>

<script>

const items = [

["مورچه و شته","همیاری","ant.jpg"],
["زنبور و گل","همیاری","bee.jpg"],
["میگوی تمیزکننده و کوسه","همیاری","cleaner.webp"],
["گلسنگ","همیاری","lichen.webp"],
["باکتری روده و انسان","همیاری","gut.jpg"],
["شیر و کفتار","همسفرگی","lion.jpg"],
["ماهی کوچک و کوسه","همسفرگی","shark.jpg"],
["کرمک و انسان","انگلی","parasite.jpg"]

];

let score = 0;
let studentName = "";

function buildCards(){

const cards = document.getElementById("cards");

cards.innerHTML = "";

items.forEach((it,index)=>{

const d = document.createElement("div");

d.className = "item";

d.id = "c"+index;

d.draggable = true;

d.dataset.type = it[1];

d.innerHTML = `
<img src="${it[2]}">
<div class="label">${it[0]}</div>
`;

d.addEventListener("dragstart",e=>{
e.dataTransfer.setData("text",d.id);
});

cards.appendChild(d);

});

}

buildCards();

document.querySelectorAll(".zone").forEach(zone=>{

zone.addEventListener("dragover",e=>{
e.preventDefault();
});

zone.addEventListener("drop",e=>{

e.preventDefault();

const id = e.dataTransfer.getData("text");

const el = document.getElementById(id);

if(el.dataset.type === zone.dataset.type){

if(!el.classList.contains("correct")){

score++;

document.getElementById("score").textContent = score;

}

el.classList.add("correct");

zone.appendChild(el);

}else{

alert("❌ پاسخ نادرست");

}

});

});

function startGame(){

studentName =
document.getElementById("student").value ||
"شرکت‌کننده عزیز";

document.getElementById("start").classList.add("hidden");

document.getElementById("game").classList.remove("hidden");

}

function finishGame(){

document.getElementById("game").classList.add("hidden");

document.getElementById("finish").classList.remove("hidden");

let medal = "🥉";

if(score >= 6) medal = "🥈";

if(score === 8) medal = "🥇";

document.getElementById("medal").textContent = medal;

document.getElementById("finalText").innerHTML =
studentName +
"<br><br>امتیاز شما: <b>" +
score +
" از 8</b><br><br>مدرسه فرزانگان ۱ شهریار<br>دبیر: سرکار خانم معصومه مرتجایی";

}

</script>

</body>
</html>
```
